# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: true

reviews:
  profile: "assertive" # Rigorous inspection for security, architectural correctness, static builds, and bugs
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/.next/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!package-lock.json"
  path_instructions:
    - path: "src/app/api/**/*.ts"
      instructions: |
        - SECURITY AUDIT: Validate all incoming payloads to prevent SQL injection, NoSQL injection, and prompt injection.
        - Ensure sensitive API keys (OPENROUTER_API_KEY, GEMINI_API_KEY, SUPABASE_SERVICE_ROLE_KEY) are NEVER exposed to client bundles or returned in JSON responses.
        - Verify authentication and session validation using Supabase server client before returning protected user data.
        - Check for rate limiting and payload size limits on AI endpoints to prevent denial-of-service or billing exhaustion.
    - path: "src/app/**/*.tsx"
      instructions: |
        - SECURITY: Check Next.js App Router conventions (server vs client components).
        - Ensure sensitive environment variables are not accessed in client components ('use client').
        - Verify all dynamic useSearchParams() calls are enclosed in <Suspense> boundaries to prevent prerender build failures.
        - Enforce XSS prevention when rendering user-submitted text or markdown.
    - path: "src/components/**/*.tsx"
      instructions: |
        - Security & XSS: Verify inputs are sanitized before rendering.
        - Accessibility and clean hook dependencies without memory leaks.
    - path: "next.config.ts"
      instructions: |
        - Verify HTTP Security Headers (Content-Security-Policy, X-Frame-Options: DENY, X-Content-Type-Options: nosniff, Referrer-Policy, Permissions-Policy).
  tools:
    eslint:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true

chat:
  auto_reply: true
